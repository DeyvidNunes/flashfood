version: '3.8'

services:
  # BANCO DE DADOS MYSQL
  db:
    image: mysql:8.0
    container_name: flashfood-mysql
    restart: always
    environment:
      MYSQL_DATABASE: FlashFood
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # BACKEND SPRING BOOT (Contexto na raiz)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashfood-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/FlashFood?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

  # FRONT-END NEXT.JS (Contexto na pasta flashfood-frontend)
  frontend:
    build:
      context: ./flashfood-frontend
      dockerfile: Dockerfile
    container_name: flashfood-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  mysql_data: